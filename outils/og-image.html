<!doctype html><html lang="fr"><meta charset="utf-8">

<style>
@font-face{font-family:P;font-weight:700;src:url(../fonts/poppins-latin-700-normal.woff2)}
@font-face{font-family:P;font-weight:600;src:url(../fonts/poppins-latin-600-normal.woff2)}
html,body{margin:0}
.og{width:1200px;height:630px;box-sizing:border-box;display:flex;align-items:center;gap:64px;padding:0 70px 0 80px;position:relative;overflow:hidden;font-family:P,sans-serif;color:#2A1A14;

.photo img{position:relative;width:100%;height:100%;object-fit:cover;object-position:50% 10%;border-radius:999px 999px 36px 36px;box-shadow:0 20px 50px rgba(42,26,20,.18)}
.sym{width:92px;display:block;margin-bottom:8px}
.k{font-weight:600;font-size:26px;letter-spacing:.24em;text-transform:uppercase;color:#A84A26}
h1{margin:4px 0 14px;font-size:96px;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.r{font-weight:600;font-size:25px;line-height:1.35;color:#6B5448;max-width:600px}
.r b{color:#2A1A14}
.d{display:inline-flex;margin-top:28px;background:#B9562F;color:#fff;font-weight:600;font-size:28px;padding:14px 30px;border-radius:999px;white-space:nowrap}
</style>
<div class="og">
  <div class="photo"><img src="../images/candidat/candidat-accueil.jpg" alt=""></div>
  <div>
    <img class="sym" src="../images/logo/logo-symbole.svg" alt="">
    <div class="k">Votez</div>
    <h1>Solid’Action</h1>
    <div class="r"><b>Salam</b>, candidat à la présidence de l’Association des Étudiants et Stagiaires Sénégalais de Toulouse</div>
    <div class="d">Dimanche 25 octobre 2026</div>
  </div>
